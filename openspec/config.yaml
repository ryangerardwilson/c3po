schema: spec-driven

context: |
  c3po is one CLI. Each app is a top-level command,
  c3po <name>. The apps are ast, deport, gcal, gdrive,
  gmail, pass, tunnel, and tui. A terminal screen is only
  c3po tui cyclotree, c3po tui l, c3po tui o,
  c3po tui tunnel, c3po tui gdrive, c3po tui pass, or c3po tui deport.
  ast is the AST-aware agent boundary.
  Product truth lives in this repository.

rules:
  proposal:
    - Describe the observable problem, outcome, scope and migration impact.
  specs:
    - Use SHALL or MUST and concrete scenarios, including failure behavior.
  tasks:
    - Include strict validation and relevant tests; complete only verified work.
