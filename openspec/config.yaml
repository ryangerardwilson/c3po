schema: spec-driven

context: |
  c3po is one CLI. Each app is a top-level command,
  c3po <name>. The apps are ast, clippy, deport, dirt, gcal, gdrive,
  gmail, idealake, looptab, mess, notify, pass, slack, and tunnel. There is no
  c3po tui command. c3po notify sends an omarchy-shell toast. c3po dirt lists the dirty git
  repositories under home or one path and does not enter ~/.local. c3po clippy copies a multiline text to the Wayland clipboard
  and does not print it. c3po idealake stores ideas by topic. c3po looptab
  registers jobs files and edits them in vim. c3po mess reports linked
  worktrees to tidy and what is blocked until they are cleaned. Screens run in r2d2:
  web, cyclotree, l, o, tunnel, gdrive, pass, deport, xl, looptab, and slack.
  The trainer is crusade -m nlp.
  ast is the AST-aware agent boundary.
  Product truth lives in this repository.

rules:
  proposal:
    - Describe the observable problem, outcome, scope and migration impact.
  specs:
    - Use SHALL or MUST and concrete scenarios, including failure behavior.
  tasks:
    - Include strict validation and relevant tests; complete only verified work.
