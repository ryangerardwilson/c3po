schema: spec-driven

context: |
  c3po is one CLI. Each app is a top-level command,
  c3po <name>. The apps are ast, cyclotree, deport,
  gcal, gdrive, gmail, l, o, pass, and tunnel.
  ast is the AST-aware agent boundary. cyclotree is the
  call tree. The other apps are the retired Apps of the
  same names. Product truth lives in this repository.

rules:
  proposal:
    - Describe the observable problem, outcome, scope and migration impact.
  specs:
    - Use SHALL or MUST and concrete scenarios, including failure behavior.
  tasks:
    - Include strict validation and relevant tests; complete only verified work.
