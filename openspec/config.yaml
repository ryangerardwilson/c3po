schema: spec-driven

context: |
  c3po is one CLI for scouting tools. The command is
  c3po scout <name>. The scouts are ast and cyclotree.
  ast is the AST-aware agent boundary. cyclotree is the
  call tree. Product truth lives in this repository.

rules:
  proposal:
    - Describe the observable problem, outcome, scope and migration impact.
  specs:
    - Use SHALL or MUST and concrete scenarios, including failure behavior.
  tasks:
    - Include strict validation and relevant tests; complete only verified work.
